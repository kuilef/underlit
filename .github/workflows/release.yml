name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish; leave empty to only build and test'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Resolve release version
        id: tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          [xml]$project = Get-Content src/Underlit/Underlit.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $manualRelease = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)
          $publish = $env:GITHUB_REF_TYPE -eq 'tag' -or $manualRelease
          $tag = if ($manualRelease) { $env:REQUESTED_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$' -or $tag -ne "v$version") {
            throw "Tag '$tag' does not match project version '$version'."
          }
          "name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run brightness regression checks
        shell: pwsh
        run: |
          dotnet run --project tests/Underlit.Engine.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Underlit.Display.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish both Windows packages
        shell: pwsh
        run: |
          dotnet publish src/Underlit/Underlit.csproj -c Release -p:PublishProfile=PortableCompact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Underlit/Underlit.csproj -c Release -p:PublishProfile=DesktopRuntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $source = (Resolve-Path artifacts/portable-compact).Path
          $output = (New-Item -ItemType Directory -Path artifacts/release -Force).FullName
          & $iscc "/DMyAppVersion=$env:RELEASE_VERSION" "/DMyAppSourceDir=$source" "/O$output" installer/Underlit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test installation and removal
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ./scripts/test-installer.ps1 -InstallerPath "artifacts/release/UnderlitSetup-$env:RELEASE_VERSION.exe" -ExpectedExePath artifacts/portable-compact/Underlit.exe -ExpectedVersion $env:RELEASE_VERSION

      - name: Package portable downloads and checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          Compress-Archive -LiteralPath artifacts/portable-compact/Underlit.exe -DestinationPath "artifacts/release/Underlit-$env:RELEASE_VERSION-portable-win-x64.zip" -CompressionLevel Optimal
          Compress-Archive -LiteralPath artifacts/desktop-runtime/Underlit.exe -DestinationPath "artifacts/release/Underlit-$env:RELEASE_VERSION-desktop-runtime-win-x64.zip" -CompressionLevel Optimal
          Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii

      - name: Save build outputs and installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Underlit-win-x64-${{ github.run_number }}
          path: |
            artifacts/release
            artifacts/installer-smoke
          retention-days: 7
          compression-level: 0

      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ steps.tag.outputs.commit }}
          name: Underlit ${{ steps.tag.outputs.version }} (kuilef fork)
          body_path: docs/releases/${{ steps.tag.outputs.version }}.md
          files: |
            artifacts/release/UnderlitSetup-*.exe
            artifacts/release/Underlit-*.zip
            artifacts/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
